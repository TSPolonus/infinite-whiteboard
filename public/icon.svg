<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Infinity symbol & drawing pencil path -->
  <path d="M160 256 C160 200, 220 200, 256 256 C292 312, 352 312, 352 256 C352 200, 292 200, 256 256 C220 312, 160 312, 160 256 Z" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Glowing Laser pointer dot -->
  <circle cx="352" cy="256" r="14" fill="#f43f5e" filter="url(#glow)" />
  <circle cx="352" cy="256" r="8" fill="#ffffff" />

  <!-- Pencil / Stylus tip -->
  <polygon points="160,256 130,230 140,280" fill="#38bdf8" />
</svg>
